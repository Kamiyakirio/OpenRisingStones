[workspace]
members = ["crates/protocol", "crates/host"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.77.2"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = "1.8"

# Signature verification runs during connection and is prohibitively slow without optimization.
[profile.dev.package.game-bridge-host]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
